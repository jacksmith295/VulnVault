services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://vulnvault:vulnvault@db:5432/vulnvault
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      BETTER_AUTH_URL: http://${LAN_IP:?Set LAN_IP in .env.lan}:3001
      GITHUB_APP_ID: ""
      GITHUB_APP_PRIVATE_KEY_FILE: ""
    ports:
      - "${LAN_IP:?Set LAN_IP in .env.lan}:3001:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mailpit:
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
