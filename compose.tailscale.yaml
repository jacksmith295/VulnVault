services:
  tailscale:
    image: tailscale/tailscale:stable@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    restart: unless-stopped
    environment:
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_BOOT_TIMEOUT: 10m
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: vulnvault
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./docker/tailscale:/config:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://vulnvault:vulnvault@db:5432/vulnvault
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      BETTER_AUTH_URL: https://${TAILSCALE_DNS_NAME:?Set TAILSCALE_DNS_NAME in .env.tailscale}
      GITHUB_APP_ID: ""
      GITHUB_APP_PRIVATE_KEY_FILE: ""
    network_mode: service:tailscale
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      tailscale:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mailpit:
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  tailscale_state:
